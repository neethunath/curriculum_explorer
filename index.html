<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Progression Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-8">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold tracking-tight">Curriculum Progression Explorer</h1>
            <p class="text-indigo-100 mt-1">Select a topic to view its complete curriculum progression table.</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full p-6 flex-grow">
        
        <!-- Search & Filter Controls -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2">
                <label for="topicSelect" class="block text-sm font-medium text-slate-700 mb-2">Select or Search Topic:</label>
                <select id="topicSelect" class="w-full border border-slate-300 rounded-lg p-3 text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    <option value="">-- Choose a Topic --</option>
                </select>
            </div>
            <div class="w-full md:w-1/2 flex items-end">
                <div id="rowCount" class="text-sm text-slate-500 font-medium ml-auto"></div>
            </div>
        </div>

        <!-- Results Table Container -->
        <div id="progressionContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="text-center py-16 text-slate-400">
                <p class="text-lg">Please select a topic above to view its curriculum table.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500 mt-auto">
        Curriculum Progression Tool &bull; Table View
    </footer>

    <!-- Application Script -->
    <script>
        let curriculumData = [];

        async function loadData() {
            try {
                const response = await fetch('data.json');
                curriculumData = await response.json();
                populateTopics();
            } catch (error) {
                console.error("Error loading data.json:", error);
                document.getElementById('progressionContainer').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-xl text-center">
                        <p class="font-semibold">Could not load <code>data.json</code>.</p>
                        <p class="text-sm mt-1">Make sure <code>data.json</code> is saved in the same folder as this HTML file.</p>
                    </div>
                `;
            }
        }

        function populateTopics() {
            const topics = [...new Set(curriculumData.map(item => item.Topic))].filter(Boolean).sort();
            const select = document.getElementById('topicSelect');
            
            topics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                option.textContent = topic;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                renderTable(e.target.value);
            });
        }

        function renderTable(selectedTopic) {
            const container = document.getElementById('progressionContainer');
            const countDisplay = document.getElementById('rowCount');

            if (!selectedTopic) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400"><p class="text-lg">Please select a topic above to view its curriculum table.</p></div>`;
                countDisplay.textContent = '';
                return;
            }

            const filtered = curriculumData.filter(item => item.Topic === selectedTopic);
            countDisplay.textContent = `Showing ${filtered.length} entries for "${selectedTopic}"`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400"><p>No entries found for this topic.</p></div>`;
                return;
            }

            let html = `
                <div class="px-6 py-4 bg-slate-50 border-b border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800">Progression Table: ${selectedTopic}</h2>
                </div>
                <div class="max-h-[650px] overflow-y-auto overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-slate-100 shadow-sm z-10">
                            <tr class="text-slate-700 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="p-3.5 font-semibold">Grade</th>
                                <th class="p-3.5 font-semibold">Outcome ID</th>
                                <th class="p-3.5 font-semibold">Outcome</th>
                                <th class="p-3.5 font-semibold">Learning Objectives</th>
                                <th class="p-3.5 font-semibold">Content & Links</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 text-sm text-slate-700">
            `;

            filtered.forEach(item => {
                const grade = item.Grade || '-';
                const outcomeId = item["Outcome ID"] || '-';
                const outcome = item.Outcome || '-';
                const objectives = item["Learning Objectives"] || '-';

                // Dynamically collect all Content Title & URL fields (1 through 7+)
                // Dynamically collect all Content Title & URL fields (1 through 7+)
                let contentLinksHtml = '';
                let index = 1;
                while (item[`Content Title ${index}`] !== undefined) {
                    const title = item[`Content Title ${index}`];
                    const url = item[`Content URL ${index}`];

                    if (title !== undefined && title !== null && title !== '') {
                        const trimmedTitle = String(title).trim();
                        const trimmedUrl = url !== undefined && url !== null ? String(url).trim() : '';

                        if (trimmedTitle.toUpperCase() === 'NA') {
                            contentLinksHtml += `<div class="mb-1 text-slate-500">NA</div>`;
                        } else if (trimmedUrl !== '' && trimmedUrl.toUpperCase() !== 'NA' && trimmedUrl !== '-') {
                            contentLinksHtml += `<div class="mb-1"><a href="${trimmedUrl}" target="_blank" class="text-indigo-600 hover:text-indigo-900 underline font-medium">🎮 ${trimmedTitle}</a></div>`;
                        } else {
                            contentLinksHtml += `<div class="mb-1 text-slate-700">🎮 ${trimmedTitle}</div>`;
                        }
                    }
                    index++;
                }
                if (!contentLinksHtml) {
                contentLinksHtml = '-';
                }
                html += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3.5 whitespace-nowrap font-medium text-slate-900">${grade}</td>
                        <td class="p-3.5 break-all text-slate-500 font-mono text-xs">${outcomeId}</td>
                        <td class="p-3.5">${outcome}</td>
                        <td class="p-3.5">${objectives}</td>
                        <td class="p-3.5">${contentLinksHtml}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        loadData();
    </script>
</body>
</html>
