<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Progression Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-8">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl font-bold tracking-tight">Curriculum Progression Explorer</h1>
            <p class="text-indigo-100 mt-1">Filter by topic to track concept evolution across grades instantly.</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto w-full p-6 flex-grow">
        
        <!-- Search & Filter Controls -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2">
                <label for="topicSelect" class="block text-sm font-medium text-slate-700 mb-2">Select or Search Topic:</label>
                <select id="topicSelect" class="w-full border border-slate-300 rounded-lg p-3 text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    <option value="">-- Choose a Topic --</option>
                </select>
            </div>
            <div class="w-full md:w-1/2 flex items-end">
                <div id="rowCount" class="text-sm text-slate-500 font-medium ml-auto"></div>
            </div>
        </div>

        <!-- Results Progression Area -->
        <div id="progressionContainer" class="space-y-6">
            <div class="text-center py-16 text-slate-400">
                <p class="text-lg">Please select a topic above to view its grade-wise progression.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500">
        Curriculum Progression Tool &bull; Instant Client-Side Filtering
    </footer>

    <!-- Application Script -->
    <script>
        let curriculumData = [];

        // Fetch data.json on load
        async function loadData() {
            try {
                const response = await fetch('data.json');
                curriculumData = await response.json();
                populateTopics();
            } catch (error) {
                console.error("Error loading data.json:", error);
                document.getElementById('progressionContainer').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center">
                        <p class="font-semibold">Could not load <code>data.json</code>.</p>
                        <p class="text-sm mt-1">Make sure <code>data.json</code> is saved in the same folder as this HTML file.</p>
                    </div>
                `;
            }
        }

        // Populate dropdown with unique topics
        function populateTopics() {
            const topics = [...new Set(curriculumData.map(item => item.topic))].sort();
            const select = document.getElementById('topicSelect');
            
            topics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                option.textContent = topic;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                renderProgression(e.target.value);
            });
        }

        // Render progression cards grouped by grade
        function renderProgression(selectedTopic) {
            const container = document.getElementById('progressionContainer');
            const countDisplay = document.getElementById('rowCount');

            if (!selectedTopic) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400"><p class="text-lg">Please select a topic above to view its grade-wise progression.</p></div>`;
                countDisplay.textContent = '';
                return;
            }

            // Filter data instantly using JS
            const filtered = curriculumData.filter(item => item.topic === selectedTopic);
            countDisplay.textContent = `Showing ${filtered.length} entries for "${selectedTopic}"`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400"><p>No entries found for this topic.</p></div>`;
                return;
            }

            // Sort by grade if possible, or group them
            let html = `<h2 class="text-xl font-bold text-slate-800 mb-4">Progression Pathway: ${selectedTopic}</h2>`;
            html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;

            filtered.forEach(item => {
                html += `
                    <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <span class="inline-block bg-indigo-50 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded-full mb-3">${item.grade || 'General'}</span>
                            <h3 class="font-bold text-slate-900 text-base mb-2">${item.objective || item.example || 'Concept Detail'}</h3>
                            <p class="text-slate-600 text-sm mb-4">${item.description || item.outcome || ''}</p>
                        </div>
                        ${item.game ? `<div class="mt-4 pt-3 border-t border-slate-100 text-xs text-emerald-700 font-medium bg-emerald-50 px-3 py-2 rounded-lg">🎮 Game/Activity: ${item.game}</div>` : ''}
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
